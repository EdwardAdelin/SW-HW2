<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Semantic Book Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h1>Available Books</h1>
<ul class="list-group mt-3">
    <li th:each="book : ${books}" class="list-group-item">
        <a th:href="@{'/book/' + ${book}}" th:text="${book}">Book Name</a>
    </li>
</ul>

<!-- This line pulls in the fragment we created above -->
<div th:replace="~{chat-widget :: chat-bot}"></div>

</body>
</html>
